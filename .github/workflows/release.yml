name: release

# A release is triggered by a tag, and nothing else. `pnpm release <version>`
# creates the tag locally (docs/release.md); pushing it is the publish decision.
#
#   pnpm release next          # bump every version, verify, commit, tag
#   git push origin main --follow-tags
#
# This workflow never decides a version number. It checks that the tag agrees
# with every manifest, builds the tarball the same way a maintainer would, and
# publishes it with npm trusted publishing (OIDC) — no npm token is stored in
# this repository or on anyone's machine.
on:
  push:
    tags:
      - 'v*'
  # For a dry run: build and verify the tarball, then stop before publishing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify only (do not publish)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Two releases must never race for the same version number.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # mint the OIDC token npm trusted publishing verifies
    steps:
      - uses: actions/checkout@v4
        with:
          # `release:verify --tag` compares the tag with HEAD, and the changelog
          # is generated from the history, so the full log has to be here.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          # Node 22.20 is what tsdown needs (see the npm note below), and it is
          # what the maintainers run locally.
          node-version: 22.20.0
          cache: pnpm
          # No `registry-url`: that writes an `.npmrc` with a token placeholder,
          # which would make npm try token auth instead of OIDC.

      # Trusted publishing is an npm CLI feature (>= 11.5.1). Node 22.20 ships
      # npm 10.9.3, which has no OIDC support at all: `npm publish` ignores the
      # id-token, finds no token, and fails with ENEEDAUTH — which looks
      # exactly like a missing trusted-publisher configuration on npmjs.com.
      - name: Update npm for trusted publishing
        run: npm install --global npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      # Playwright downloads its browsers separately from npm packages; the
      # e2e step fails with "Executable doesn't exist" without this. The
      # `--with-deps` variant also installs the OS libraries Chromium needs.
      - name: Install the browser for e2e
        run: pnpm --filter diorama-web exec playwright install --with-deps chromium

      # The version is the tag, and the tag must be the commit that was
      # reviewed. Both halves of that are checked before anything is built.
      - name: Verify the tag matches every manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release/verify.mjs --tag "${{ github.ref_name }}"

      - name: Verify the working tree is consistent
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/release/verify.mjs

      - name: Build the four checks
        run: |
          pnpm build
          pnpm test:unit
          pnpm -r --no-sort run typecheck
          pnpm --filter diorama-web exec playwright test

      # Assembles plugins/, web/, README.md and LICENSE next to the bundle.
      # Without it the tarball has no page shell and no README (docs/m8 §5).
      - name: Assemble the package
        run: node scripts/assemble-package.mjs

      - name: Verify the tarball contents
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # `npm pack --silent` prints the bare file name, not the path it
          # wrote to (`--pack-destination` decides that), so join them here
          # rather than handing `verify.mjs` a name it cannot resolve.
          name="$(cd packages/cli && npm pack --silent --pack-destination "$RUNNER_TEMP")"
          node scripts/release/verify.mjs --tag "${{ github.ref_name }}" --tarball "$RUNNER_TEMP/$name"

      # Before publishing, prove the pieces trusted publishing depends on are
      # actually present. npm swallows every OIDC failure (see `oidc()` in its
      # publish path), so without this a misconfiguration is only visible as
      # ENEEDAUTH — which is also what a *missing* trusted publisher looks like.
      - name: Check the trusted-publishing prerequisites
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "npm:  $(npm --version)  (needs >= 11.5.1)"
          echo "node: $(node --version)"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is empty — the job lacks 'permissions: id-token: write'"
            exit 1
          fi
          echo "id-token endpoint: present"
          # Exchange the id-token for a short-lived npm token. A 404/401 here
          # means npmjs.com has no trusted publisher matching this repository,
          # workflow file and ref — that is a configuration problem on npm, not
          # a workflow problem.
          #
          # Success is **201 Created**, not 200: the exchange creates a token.
          # (The first version of this check accepted only 200 and failed a
          # release that had actually succeeded.)
          status=$(curl -s -o "$RUNNER_TEMP/oidc.json" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $(curl -s \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
              | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).value')" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@diorama-cli%2Fdiorama")
          echo "token exchange: HTTP $status"
          case "$status" in
            200|201)
              # Never print the token itself, only the fact that one arrived.
              node -e '
                const body = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))
                if (!body.token) {
                  console.error("::error::the exchange returned no token")
                  process.exit(1)
                }
                console.log(`trusted publisher: OK (token valid for ${body.expires - body.created}s)`)
              ' "$RUNNER_TEMP/oidc.json"
              ;;
            *)
              echo "::error::npm refused the OIDC token exchange (HTTP $status). Check the trusted publisher on npmjs.com: owner=diorama-cli, repo=diorama, workflow=release.yml, Environment left empty."
              cat "$RUNNER_TEMP/oidc.json" || true
              exit 1
              ;;
          esac

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        working-directory: packages/cli
        env:
          # `oidc()` in npm's publish path returns silently when it cannot
          # exchange the id-token, and the failure then surfaces as a plain
          # ENEEDAUTH — indistinguishable from "no trusted publisher
          # configured". Verbose logging names the actual reason
          # (`log.verbose('oidc', ...)` / `log.silly('oidc', ...)`).
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          # Trusted publishing mints the credential from the OIDC token and
          # adds provenance automatically — no `--provenance`, no token.
          npm publish --access public

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the entry `pnpm release` wrote into CHANGELOG.md, so
          # the release page and the changelog cannot disagree.
          awk -v tag="${{ github.ref_name }}" '
            $0 ~ "^## " substr(tag, 2) " " { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag

      - name: Summarise
        run: |
          {
            echo "### release ${{ github.ref_name }}"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run: built and verified, not published."
            else
              echo "Published \`@diorama-cli/diorama@$(node -p "require('./packages/cli/package.json').version")\`."
              echo "https://www.npmjs.com/package/@diorama-cli/diorama"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
